name: Build & Push Docker Image

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # Quyen de bot commit nguoc lai repo
      packages: write

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Log in to GitHub Container Registry (ghcr.io)
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Build and Push Docker Image
      uses: docker/build-push-action@v5
      with:
        context: .
        push: true
        tags: |
          ghcr.io/${{ github.repository }}:${{ github.sha }}
          ghcr.io/${{ github.repository }}:latest

    # TỰ ĐỘNG CẬP NHẬT TAG VÀO K8S DEPLOYMENT CHO ARGOCD
    - name: Update Image Tag in K8s Manifest
      run: |
        sed -i 's|image: ghcr.io/.*|image: ghcr.io/${{ github.repository }}:${{ github.sha }}|' k8s/deployment.yaml
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        git add k8s/deployment.yaml
        git diff --staged --quiet || (git commit -m "chore(k8s): update image tag to ${{ github.sha }} [skip ci]" && git push)
